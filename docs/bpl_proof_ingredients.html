<header><div class="controls"><button id="none" type="button">All off</button><button id="all" type="button">All on</button>
<button id="fit" type="button">Fit width</button><button id="full" type="button">Full size</button>
<span id="summary" aria-live="polite"></span></div>
<p>Click an ingredient to switch it on or off; faded boxes are off. A task is on when all its ingredients are on.
An obstacle is on when not all of its <span class="teal">improving</span> ingredients are on, and either it has no
<span class="orange">worsening</span> ingredients or at least one of them is on. An arrow is shown when its ingredient is on.</p></header>

<title id="title">BPL: tasks, ingredients, and obstacles</title>
<desc id="description">Three columns with six task nodes, ten unique ingredient nodes, and eight unique obstacle nodes. Seventeen blue-gray arrows show task uses. Fourteen solid teal arrows improve obstacles; thirteen dashed orange arrows introduce or worsen them. Task 2 prime strengthens task 2. Finish is an added closure outside the numbered notes. Spatial positions are not execution order.</desc>

<g id="use-task4-6" class="edge" data-edge="true" data-source="task4" data-target="i6" data-sign="uses"><title>Averaging can enlarge supports; row compression controls their representation and its error.</title><path d="M 561 1245.5 C 751.85 1245.5 717.15 1319 908 1319" fill="none" stroke="#FFFFFF" stroke-width="6.8"/><path d="M 561 1245.5 C 751.85 1245.5 717.15 1319 908 1319" fill="none" stroke="#71839D" stroke-width="2.2"/><polygon points="908,1319 901,1315 901,1323" fill="#71839D"/></g>

<script>
'use strict';
const nodes=new Map(Array.from(document.querySelectorAll('[data-node]'),el=>[el.dataset.node,el]));
const edges=Array.from(document.querySelectorAll('[data-edge]'),el=>({el,source:el.dataset.source,target:el.dataset.target,sign:el.dataset.sign,
  ingredient:el.dataset.sign==='uses'?el.dataset.target:el.dataset.source}));
const ofKind=kind=>Array.from(nodes.keys()).filter(key=>nodes.get(key).dataset.kind===kind);
const ingredients=ofKind('ingredient'),tasks=ofKind('task'),obstacles=ofKind('obstacle');
const neighbours=(key,sign)=>edges.filter(e=>e.sign===sign&&(e.source===key||e.target===key)).map(e=>e.source===key?e.target:e.source);
const uses=new Map(tasks.map(key=>[key,neighbours(key,'uses')]));
const green=new Map(obstacles.map(key=>[key,neighbours(key,'improves')]));
const red=new Map(obstacles.map(key=>[key,neighbours(key,'worsens')]));
const summary=document.getElementById('summary');
let selected=new Set();
function active(){
  const on=new Set(selected),has=key=>selected.has(key);
  for(const key of tasks)if(uses.get(key).every(has))on.add(key);
  for(const key of obstacles){const r=red.get(key);if(!green.get(key).every(has)&&(r.length===0||r.some(has)))on.add(key);}
  return on;
}
function render(){
  const on=active(),count=list=>list.filter(key=>on.has(key)).length;
  for(const [key,el] of nodes)el.classList.toggle('off',!on.has(key));
  for(const key of ingredients)nodes.get(key).setAttribute('aria-checked',String(on.has(key)));
  for(const e of edges)e.el.classList.toggle('off',!on.has(e.ingredient));
  summary.textContent=count(ingredients)+'/'+ingredients.length+' ingredients · '+count(tasks)+'/'+tasks.length+' tasks · '+count(obstacles)+'/'+obstacles.length+' obstacles on';
  const ids=ingredients.filter(key=>on.has(key)).map(key=>key.slice(1));
  history.replaceState(null,'',ids.length?'#on='+ids.join(','):location.pathname+location.search);
}
function set(keys){selected=new Set(keys);render();}
function toggle(key){selected.has(key)?selected.delete(key):selected.add(key);render();}
for(const key of ingredients){
  const el=nodes.get(key);el.setAttribute('tabindex','0');el.setAttribute('role','switch');
  el.addEventListener('click',()=>toggle(key));
  el.addEventListener('keydown',event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();toggle(key);}});
}
document.getElementById('none').addEventListener('click',()=>set([]));
document.getElementById('all').addEventListener('click',()=>set(ingredients));
document.getElementById('fit').addEventListener('click',()=>{document.getElementById('drawing').style.width='100%';});
document.getElementById('full').addEventListener('click',()=>{document.getElementById('drawing').style.width='2250px';});
const initial=/^#on=([0-9,]+)$/.exec(location.hash);
set(initial?initial[1].split(',').map(id=>'i'+id).filter(key=>ingredients.includes(key)):[]);
</script></body></html>
